<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لا يوجد اتصال — متجري</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Tahoma, Arial, sans-serif;
        background: #fafafa;
        color: #171717;
      }

      .card {
        max-width: 420px;
        margin: 24px;
        padding: 32px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e5e5e5;
        border-radius: 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
      }

      p {
        margin: 0 0 24px;
        color: #525252;
        line-height: 1.8;
      }

      button {
        padding: 12px 24px;
        border: 0;
        border-radius: 999px;
        background: #171717;
        color: #ffffff;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تعذر تحميل الصفحة. تأكد من اتصالك ثم حاول مرة أخرى.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
